#_preseed_V1

### Locale and keyboard
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### Network
d-i netcfg/choose_interface select auto
d-i netcfg/get_nameservers string 9.9.9.9
d-i netcfg/get_hostname string snapper-test
d-i netcfg/get_domain string localdomain

### Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Clock and timezone
d-i clock-setup/utc boolean true
d-i time/zone string UTC

### Root account
d-i passwd/root-login boolean true
d-i passwd/root-password password snapper-test
d-i passwd/root-password-again password snapper-test
d-i passwd/make-user boolean false

### Partitioning — biosboot + /boot ext4 + btrfs root
d-i partman-auto/method string regular
d-i partman-auto/disk string /dev/vda
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true

d-i partman-auto/expert_recipe string                         \
      btrfs-root ::                                           \
              1 1 1 free                                      \
                      $bios_boot{ }                           \
                      method{ biosgrub }                      \
              .                                               \
              1024 1024 1024 ext4                              \
                      $primary{ } $bootable{ }                \
                      method{ format } format{ }              \
                      use_filesystem{ } filesystem{ ext4 }    \
                      mountpoint{ /boot }                     \
              .                                               \
              4096 10000 -1 btrfs                              \
                      $primary{ }                             \
                      method{ format } format{ }              \
                      use_filesystem{ } filesystem{ btrfs }   \
                      mountpoint{ / }                         \
              .

d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-basicfilesystems/no_swap boolean false

### Packages
tasksel tasksel/first multiselect standard
d-i pkgsel/include string \
    openssh-server btrfs-progs acl rsync \
    autoconf automake libtool make g++ gettext \
    libboost-dev libboost-thread-dev libboost-test-dev \
    libxml2-dev zlib1g-dev libdbus-1-dev libjson-c-dev \
    libpam0g-dev xsltproc docbook-xsl locales-all \
    libncurses-dev libacl1-dev libmount-dev libbtrfsutil-dev libbtrfs-dev
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

### Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/vda

### Finish
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean true

### Post-install: SSH setup + serial console
d-i preseed/late_command string \
    mkdir -p /target/root/.ssh; \
    chmod 700 /target/root/.ssh; \
    echo "@@SSH_PUBKEY@@" > /target/root/.ssh/authorized_keys; \
    chmod 600 /target/root/.ssh/authorized_keys; \
    mkdir -p /target/etc/ssh/sshd_config.d; \
    echo "PermitRootLogin yes" > /target/etc/ssh/sshd_config.d/99-snapper-test.conf; \
    echo "PasswordAuthentication yes" >> /target/etc/ssh/sshd_config.d/99-snapper-test.conf; \
    sed -i 's/^GRUB_CMDLINE_LINUX_DEFAULT=.*/GRUB_CMDLINE_LINUX_DEFAULT="console=tty0 console=ttyS0,115200n8"/' /target/etc/default/grub; \
    echo 'GRUB_TERMINAL="console serial"' >> /target/etc/default/grub; \
    echo 'GRUB_SERIAL_COMMAND="serial --speed=115200 --unit=0 --word=8 --parity=no --stop=1"' >> /target/etc/default/grub; \
    mount --bind /dev /target/dev; \
    mount --bind /proc /target/proc; \
    mount --bind /sys /target/sys; \
    chroot /target update-grub; \
    umount /target/sys /target/proc /target/dev
